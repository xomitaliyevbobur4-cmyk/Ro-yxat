<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клиенты и сметы</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c2530;--mu:#6b7480;--ac:#f2b705;--acx:#1c2530;--bd:#e3dfd5;--bad:#c23b2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b222a;--tx:#eef0f2;--mu:#9aa4af;--bd:#2c353f;--acx:#12161b;--bad:#ff7a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b222a;--tx:#eef0f2;--mu:#9aa4af;--bd:#2c353f;--acx:#12161b;--bad:#ff7a6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px}
main{padding:14px 14px 96px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
textarea.est{min-height:230px;font-size:14px;line-height:1.5}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:var(--acx);width:100%;margin-top:12px;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row{padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:14px}
.x{background:none;border:0;color:var(--bad);font-size:20px;padding:4px 8px;cursor:pointer}
.big{font-size:24px;font-weight:800}
.msg{background:var(--ac);color:var(--acx);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.sm{padding:9px 8px;text-align:right}
.cl{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:var(--acx);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.grow{flex:1;min-width:0}
.grow b,.grow .mu{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{font:inherit;background:none;border:0;color:var(--tx);padding:6px 0 12px;font-weight:600;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
nav button{flex:1;font:inherit;font-size:14px;font-weight:600;background:none;border:0;color:var(--mu);padding:14px 4px;cursor:pointer}
nav button.on{color:var(--tx);box-shadow:inset 0 3px 0 var(--ac)}
a{color:inherit}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var K="smeta_v2",K1="smeta_v1";
var D={me:"",prices:[{id:1,name:"Шпаклёвка стен",rate:350},{id:2,name:"Шпаклёвка потолка",rate:400},{id:3,name:"Грунтовка",rate:60},{id:4,name:"Шлифовка",rate:80}],clients:[],next:100};
(function(){try{var r=localStorage.getItem(K);if(r){var o=JSON.parse(r);if(o&&o.prices&&o.clients){D=o;return}}
 var r1=localStorage.getItem(K1);if(r1){var p=JSON.parse(r1);if(p&&p.prices){D.me=p.me||"";D.prices=p.prices;D.next=Math.max(p.next||0,100);
  var L=(p.hist||[]).map(function(s){return{t:s.t,c:s.cur}});if(p.cur&&p.cur.items&&p.cur.items.length)L.push({t:Date.now(),c:p.cur});
  L.forEach(function(x){D.clients.push({id:D.next++,name:x.c.client||"",phone:"",addr:x.c.addr||"",note:"",estimates:[{id:D.next++,t:x.t,items:x.c.items}]})})}}}catch(e){}})();
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var S={arm:"",tab:"cl",cid:null,eid:null,q:"",t:"",msg:"",dim:{l:"",w:"",h:"",o:""}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rub(n){return Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g," ")+" ₽"}
function sq(n){return String(Math.round(n*100)/100).replace(".",",")+" м²"}
function num(v){var n=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isNaN(n)?0:n}
function nid(){return D.next++}
function dstr(t){var d=t?new Date(t):new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()}
function tot(e){return e.items.reduce(function(s,i){return s+i.m*i.r},0)}
function nm(c){return c.name||"Без имени"}
function ini(c){return (c.name||"?").trim().split(/\s+/).map(function(x){return x[0]}).slice(0,2).join("").toUpperCase()}
function cli(){return D.clients.filter(function(c){return c.id==S.cid})[0]}
function est(){var c=cli();return c?c.estimates.filter(function(e){return e.id==S.eid})[0]:null}
function lastEst(c){return c.estimates.slice().sort(function(a,b){return b.t-a.t})[0]}
function estText(){var c=cli(),e=est();if(!c||!e)return "";var t="Смета на отделочные работы\n";
 if(c.name)t+="Заказчик: "+c.name+"\n";if(c.addr)t+="Объект: "+c.addr+"\n";t+="Дата: "+dstr(e.t)+"\n\n";
 if(!e.items.length)t+="(позиции пока не добавлены)\n";
 e.items.forEach(function(i,k){t+=(k+1)+". "+i.name+": "+sq(i.m)+" × "+rub(i.r)+" = "+rub(i.m*i.r)+"\n"});
 t+="\nИтого: "+rub(tot(e))+"\n";if(D.me)t+="\nИсполнитель: "+D.me+"\n";return t}
function opts(L,sel){return L.map(function(x){return '<option value="'+x.id+'"'+(x.id==sel?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")}
function msgBar(){var h=S.msg?'<div class="msg">'+esc(S.msg)+'</div>':"";return h}
function pList(){
 var h=msgBar()+'<input id="q" type="search" placeholder="Поиск клиента" value="'+esc(S.q)+'" autocomplete="off" style="margin-bottom:12px">';
 if(!D.clients.length)h+='<div class="card mu">Клиентов пока нет. Нажмите «Добавить клиента» и заполните его данные.</div>';
 h+='<div id="nf" class="mu" hidden style="margin:8px 0">Такой клиент не найден.</div>';
 D.clients.slice().reverse().forEach(function(c){var l=lastEst(c);
  h+='<button class="cl" data-a="ocl" data-id="'+c.id+'" data-n="'+esc((c.name+" "+c.phone+" "+c.addr).toLowerCase())+'"><span class="av">'+esc(ini(c))+'</span><span class="grow"><b>'+esc(nm(c))+'</b><span class="mu">'+esc(c.addr||c.phone||"Данные не заполнены")+'</span></span><span style="text-align:right"><b>'+(l?rub(tot(l)):"")+'</b><span class="mu" style="display:block">'+(c.estimates.length?c.estimates.length+" смет.":"нет смет")+'</span></span></button>'});
 return h+'<button class="btn" data-a="newcl">Добавить клиента</button>'}
function pClient(){var c=cli();
 var h=msgBar()+'<button class="back" data-a="bcl">‹ Клиенты</button><div class="card"><h2>Данные клиента</h2><label>Имя</label><input id="cn" value="'+esc(c.name)+'" placeholder="Например: Иван Петров"><label>Телефон</label><input id="cp" type="tel" value="'+esc(c.phone)+'" placeholder="+7 900 000-00-00">'+(c.phone?'<div style="margin-top:8px"><a href="tel:'+esc(c.phone.replace(/[^\d+]/g,""))+'">Позвонить</a></div>':"")+'<label>Адрес объекта</label><input id="ca" value="'+esc(c.addr)+'" placeholder="Город, улица, дом, квартира"><label>Заметка</label><textarea id="cx" placeholder="Что нужно сделать, пожелания, договорённости">'+esc(c.note)+'</textarea></div>';
 h+='<div class="card"><h2>Сметы</h2>';
 if(!c.estimates.length)h+='<div class="mu">Смет пока нет.</div>';
 c.estimates.slice().sort(function(a,b){return b.t-a.t}).forEach(function(e){h+='<div class="row"><button class="cl" style="margin:0" data-a="oest" data-id="'+e.id+'"><span class="grow"><b>Смета от '+dstr(e.t)+'</b><span class="mu">Позиций: '+e.items.length+'</span></span><b>'+rub(tot(e))+'</b></button></div>'});
 h+='<button class="btn" data-a="newest">Новая смета</button></div><button class="btn d" data-a="delcl">'+(S.arm=="delcl"?"Нажмите ещё раз, чтобы удалить клиента":"Удалить клиента")+'</button>';
 return h}
function pEst(){var c=cli(),e=est(),d=S.dim;
 var h=msgBar()+'<button class="back" data-a="bcli">‹ '+esc(nm(c))+'</button>';
 h+='<div class="card"><h2>Добавить работу</h2><label>Вид работы</label><select id="st">'+opts(D.prices,S.t)+'</select><label>Площадь, м²</label><input id="m2" type="text" inputmode="decimal" placeholder="например 38,5"><div class="mu" style="margin-top:12px">Или посчитать по размерам комнаты (в метрах):</div><div class="four"><div><label>Длина</label><input id="dl" type="text" inputmode="decimal" value="'+esc(d.l)+'"></div><div><label>Ширина</label><input id="dw" type="text" inputmode="decimal" value="'+esc(d.w)+'"></div><div><label>Высота</label><input id="dh" type="text" inputmode="decimal" value="'+esc(d.h)+'"></div><div><label>Проёмы м²</label><input id="do" type="text" inputmode="decimal" value="'+esc(d.o)+'"></div></div><div class="two"><button class="btn g" data-a="walls">Стены → м²</button><button class="btn g" data-a="ceil">Потолок → м²</button></div><button class="btn" data-a="add">Добавить в смету</button></div>';
 h+='<div class="card"><h2>Смета от '+dstr(e.t)+'</h2>';
 if(!e.items.length)h+='<div class="mu">Пока пусто. Добавьте первую работу выше.</div>';
 e.items.forEach(function(i){h+='<div class="row"><div class="line"><b>'+esc(i.name)+'</b><button class="x" data-a="del" data-id="'+i.id+'" aria-label="Удалить">×</button></div><div class="two"><div><label>Площадь, м²</label><input class="sm" data-i="'+i.id+'" data-f="m" type="text" inputmode="decimal" value="'+String(i.m).replace(".",",")+'"></div><div><label>Цена за м², ₽</label><input class="sm" data-i="'+i.id+'" data-f="r" type="text" inputmode="numeric" value="'+i.r+'"></div></div><div class="line mu" style="margin-top:6px"><span>Сумма</span><b style="color:var(--tx)">'+rub(i.m*i.r)+'</b></div></div>'});
 h+='<div class="line" style="margin-top:12px"><b>Итого</b><span class="big">'+rub(tot(e))+'</span></div></div>';
 h+='<div class="card"><h2>Смета для клиента</h2><textarea id="est" class="est" readonly>'+esc(estText())+'</textarea><div class="two"><button class="btn" data-a="copy">Скопировать</button><button class="btn g" data-a="share">Отправить</button></div><div id="cm" class="mu" style="margin-top:8px"></div></div><button class="btn d" data-a="delest">'+(S.arm=="delest"?"Нажмите ещё раз, чтобы удалить смету":"Удалить эту смету")+'</button>';
 return h}
function pPrice(){
 var h=msgBar()+'<div class="card"><h2>Ваши данные</h2><label>Имя, телефон (попадёт в конец сметы)</label><input id="me" value="'+esc(D.me)+'" placeholder="Например: Фёдор, +7 900 000-00-00"></div>';
 h+='<div class="card"><h2>Виды работ и цена за м²</h2>'+D.prices.map(function(p){return '<div class="row line"><span style="flex:1">'+esc(p.name)+'</span><input data-r="'+p.id+'" type="text" inputmode="numeric" value="'+p.rate+'" style="width:92px;text-align:right" aria-label="Цена за м²"><span class="mu">₽</span><button class="x" data-a="dp" data-id="'+p.id+'" aria-label="Удалить">×</button></div>'}).join("")+'<div class="mu" style="margin-top:8px">Цены в примере условные. Поставьте свои. Уже готовые сметы сохраняют цену, по которой были составлены.</div><div class="two"><div><label>Новая работа</label><input id="np" placeholder="Название"></div><div><label>Цена за м²</label><input id="nr" type="text" inputmode="numeric"></div></div><button class="btn" data-a="np">Добавить в прайс</button></div>';
 return h}
function render(){
 if(!D.prices.some(function(p){return p.id==S.t}))S.t=D.prices[0]?D.prices[0].id:"";
 if(S.cid&&!cli()){S.cid=null;S.eid=null}if(S.eid&&!est())S.eid=null;
 var h="";
 if(S.tab=="price")h='<h1>Цены</h1>'+pPrice();
 else if(S.eid)h=pEst();else if(S.cid)h=pClient();else h='<h1>Клиенты</h1>'+pList();
 document.getElementById("app").innerHTML=h;
 var N=[["cl","Клиенты"],["price","Цены"]];
 document.getElementById("nav").innerHTML=N.map(function(x){return '<button data-t="'+x[0]+'"'+(S.tab==x[0]?' class="on"':"")+'>'+x[1]+'</button>'}).join("");
 if(S.tab=="cl"&&!S.cid)filt()}
function filt(){var q=(S.q||"").toLowerCase().trim(),v=0,L=document.querySelectorAll("#app .cl[data-n]");for(var i=0;i<L.length;i++){var s=!q||L[i].dataset.n.indexOf(q)>-1;L[i].hidden=!s;L[i].style.display=s?"":"none";if(s)v++}var nf=document.getElementById("nf");if(nf)nf.hidden=!(q&&!v)}
function dims(){var d=S.dim;return{l:num(d.l),w:num(d.w),h:num(d.h),o:num(d.o)}}
function fill(v){if(!(v>0)){S.msg="Введите размеры комнаты";keep();return}document.getElementById("m2").value=String(Math.round(v*100)/100).replace(".",",")}
function keep(){var sc=window.scrollY;render();window.scrollTo(0,sc)}
function copyTxt(){var e=document.getElementById("est"),m=document.getElementById("cm"),ok=false;e.removeAttribute("readonly");e.focus();e.select();e.setSelectionRange(0,99999);try{ok=document.execCommand("copy")}catch(x){}e.setAttribute("readonly","");
 if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(e.value).then(function(){m.textContent="Скопировано"}).catch(function(){m.textContent="Не удалось. Выделите текст вручную и скопируйте."});return}
 m.textContent=ok?"Скопировано. Вставьте в Telegram или WhatsApp.":"Не удалось. Выделите текст вручную и скопируйте."}
var app=document.getElementById("app");
app.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=+b.dataset.id,c=cli(),e=est();
 if(a=="walls"){var d=dims();fill(Math.max(0,2*(d.l+d.w)*d.h-d.o));return}
 if(a=="ceil"){var d2=dims();fill(d2.l*d2.w);return}
 if(a=="copy"){copyTxt();return}
 if(a=="share"){var tx=estText();if(navigator.share){navigator.share({text:tx}).catch(function(){})}else copyTxt();return}
 var prev=S.arm;S.arm="";S.msg="";var top=false;
 if(a=="ocl"){S.cid=id;S.eid=null;top=true}
 else if(a=="bcl"){S.cid=null;S.eid=null;top=true}
 else if(a=="bcli"){S.eid=null;top=true}
 else if(a=="newcl"){var nc={id:nid(),name:"",phone:"",addr:"",note:"",estimates:[]};D.clients.push(nc);S.cid=nc.id;S.eid=null;save();render();window.scrollTo(0,0);var f=document.getElementById("cn");if(f)f.focus();return}
 else if(a=="delcl"){if(prev!="delcl"){S.arm="delcl";keep();return}D.clients=D.clients.filter(function(x){return x.id!=c.id});S.cid=null;S.eid=null;save();top=true}
 else if(a=="oest"){S.eid=id;S.dim={l:"",w:"",h:"",o:""};top=true}
 else if(a=="newest"){var ne={id:nid(),t:Date.now(),items:[]};c.estimates.push(ne);S.eid=ne.id;S.dim={l:"",w:"",h:"",o:""};save();top=true}
 else if(a=="delest"){if(prev!="delest"){S.arm="delest";keep();return}c.estimates=c.estimates.filter(function(x){return x.id!=e.id});S.eid=null;save();top=true}
 else if(a=="add"){var m=num(document.getElementById("m2").value);if(!(m>0)){document.getElementById("m2").focus();return}
  var p=D.prices.filter(function(x){return x.id==S.t})[0];if(!p)return;
  e.items.push({id:nid(),name:p.name,m:m,r:p.rate});S.msg="Добавлено: "+p.name+", "+sq(m);save()}
 else if(a=="del"){e.items=e.items.filter(function(i){return i.id!=id});save()}
 else if(a=="np"){var n=document.getElementById("np").value.trim(),r=num(document.getElementById("nr").value);if(!n){document.getElementById("np").focus();return}D.prices.push({id:nid(),name:n,rate:r});save()}
 else if(a=="dp"){if(D.prices.length<2){S.msg="Должна остаться хотя бы одна работа";keep();return}D.prices=D.prices.filter(function(x){return x.id!=id});save()}
 else return;
 if(top){render();window.scrollTo(0,0)}else keep()});
app.addEventListener("input",function(ev){var t=ev.target,id=t.id,c=cli(),e=est();
 if(id=="q"){S.q=t.value;filt()}
 else if(id=="cn"&&c){c.name=t.value;save()}else if(id=="cp"&&c){c.phone=t.value;save()}else if(id=="ca"&&c){c.addr=t.value;save()}else if(id=="cx"&&c){c.note=t.value;save()}
 else if(id=="me"){D.me=t.value;save()}
 else if(id=="dl")S.dim.l=t.value;else if(id=="dw")S.dim.w=t.value;else if(id=="dh")S.dim.h=t.value;else if(id=="do")S.dim.o=t.value});
app.addEventListener("change",function(ev){var t=ev.target,e=est();
 if(t.id=="st")S.t=t.value;
 else if(t.dataset.r){var p=D.prices.filter(function(x){return x.id==t.dataset.r})[0],r=num(t.value);if(p&&r>=0){p.rate=r;save()}}
 else if(t.dataset.i&&e){var it=e.items.filter(function(x){return x.id==t.dataset.i})[0],v=num(t.value);if(it&&v>=0){it[t.dataset.f]=v;save();keep()}}
 else if(t.id=="cp"){keep()}});
document.getElementById("nav").addEventListener("click",function(ev){var b=ev.target.closest("[data-t]");if(!b)return;S.arm="";S.tab=b.dataset.t;if(S.tab=="cl"){S.cid=null;S.eid=null}S.msg="";render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
